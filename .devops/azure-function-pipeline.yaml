trigger: none
pr:
    branches:
        include:
        -   main
    paths:
        include:
        # Function app
        -   function_app.py
        -   functions/*
        -   host.json
        -   uv.lock
        -   requirements-dev.txt

        # Tests
        -   tests/*

        # Devops pipeline
        -   .devops/variables/*
        -   .devops/azure-function-pipeline-test.yml
        -   .devops/templates/azure-functions/*

variables:
-   name: pythonVersion
    value: 3.12

-   name: functionWorkingDirectory
    value: .

-   name: artifactName
    value: skillsfa

-   name: vmImageName
    value: ubuntu-latest

pool:
    vmImage: ubuntu-latest

stages:
-   stage: Test
    jobs:
    -   job: Test
        steps:
        -   bash: |
                cat > ${{variables.functionWorkingDirectory}}/local.settings.json << EOF
                    {"IsEncrypted": false, "Values": {
                        "sample_key": "sample-value"
                    }}
                EOF
                cat ${{variables.functionWorkingDirectory}}/local.settings.json
            displayName: Testing local.settings.json
        -   template: templates/azure-functions/test-func.yaml
            parameters:
                pythonVersion: ${{ variables.pythonVersion }}
                workingDirectory: ${{variables.functionWorkingDirectory}}

-   stage: AML_classification_experiment
    variables:
    -   group: 'acocatamlwstest'
    jobs:
    -   job: AML_classification_experiment
        displayName: AML_classification_experiment
        steps:
        -   bash: |
                cat > ${{variables.functionWorkingDirectory}}/local.settings.json << EOF
                    {"IsEncrypted": false, "Values": {
                        "sample_key": "sample-value"
                    }}
                EOF
                cat ${{variables.functionWorkingDirectory}}/local.settings.json
        -   template: templates/azure-machine-learning/register-classification-experiment.yaml
            parameters:
                pythonVersion: ${{ variables.pythonVersion }}
                workingDirectory: ${{ variables.functionWorkingDirectory }}

